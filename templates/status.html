{% extends "base.html" %}

{% block content %}
<section class="status-page">
  <h1>Status</h1>

  <p class="status-intro">
    This request reached the application serving machinageist.dev. Its current
    availability result appears below.
  </p>

  <dl class="status-readout">
    <dt>STATUS</dt>
    <dd>{{ status.status }}</dd>
  </dl>

  <p class="status-outro">
    Machine-readable version at <a href="/status.json">/status.json</a>.
  </p>
</section>
{% endblock %}
