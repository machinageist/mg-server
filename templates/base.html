<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ self.description() }}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:type" content="website">
  <title>{{ self.title() }}</title>
  <script src="/static/js/theme-init.js?v=20260712-theme"></script>
  <link rel="stylesheet" href="/static/css/style.css?v=20260712-theme">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="site-header">
    <nav class="site-nav" aria-label="Primary navigation">
      <a class="brand" href="/">machinageist</a>
      <div class="nav-right">
        <div class="nav-links">
          <a href="/about"     class="nav-link{% if self.section() == "about"     %} is-active{% endif %}">About</a>
          <a href="/portfolio" class="nav-link{% if self.section() == "portfolio" %} is-active{% endif %}">Portfolio</a>
          <a href="/blog"      class="nav-link{% if self.section() == "writing"   %} is-active{% endif %}">Writing</a>
          <a href="/wiki"      class="nav-link{% if self.section() == "wiki"      %} is-active{% endif %}">Archive</a>
        </div>
        <div class="theme-select" id="theme-select">
          <button id="theme-btn" class="theme-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Theme">
            <span class="theme-icon" aria-hidden="true">◐</span>
          </button>
          <div class="theme-menu" id="theme-menu" role="menu" aria-label="Theme" hidden>
            <button type="button" role="menuitemradio" data-mode="system" aria-checked="false"><span aria-hidden="true">◐</span> System</button>
            <button type="button" role="menuitemradio" data-mode="light"  aria-checked="false"><span aria-hidden="true">☀</span> Light</button>
            <button type="button" role="menuitemradio" data-mode="dark"   aria-checked="false"><span aria-hidden="true">☾</span> Dark</button>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main id="content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>machinageist.dev &mdash; Jeff Cincoski</span>
      <nav aria-label="Footer navigation">
        <a href="https://github.com/machinageist/mg-server" rel="noopener noreferrer">Source</a>
        <span>updated on: 2026-07-12</span>
      </nav>
    </div>
  </footer>

  <script src="/static/js/main.js?v=20260712-theme"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
