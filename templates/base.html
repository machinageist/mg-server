<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ self.description() }}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:type" content="website">
  <title>{{ self.title() }}</title>
  <link rel="stylesheet" href="/static/css/style.css?v=20260522-dracula">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="site-header">
    <nav class="site-nav" aria-label="Primary navigation">
      <a class="brand" href="/">machinageist</a>
      <div class="nav-links">
        <a href="/about"     class="nav-link{% if self.section() == "about"     %} is-active{% endif %}">About</a>
        <a href="/portfolio" class="nav-link{% if self.section() == "portfolio" %} is-active{% endif %}">Portfolio</a>
        <a href="/blog"      class="nav-link{% if self.section() == "writing"   %} is-active{% endif %}">Writing</a>
        <a href="/wiki"      class="nav-link{% if self.section() == "wiki"      %} is-active{% endif %}">Wiki</a>
        <a href="/releases"  class="nav-link{% if self.section() == "releases"  %} is-active{% endif %}">Releases</a>
      </div>
    </nav>
  </header>

  <main id="content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>machinageist.dev &mdash; Jeff Cincoski</span>
      <nav aria-label="Footer navigation">
        <a href="https://github.com/machinageist/mg-server" rel="noopener noreferrer">Source</a>
        <span>updated on: 2026-05-18</span>
      </nav>
    </div>
  </footer>

  <script src="/static/js/main.js?v=20260522"></script>
</body>
</html>
