<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ self.description() }}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:type" content="website">
  <title>{{ self.title() }}</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/css/style.css?v=20260711-wiki-disclaimer">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="site-header">
    <nav class="site-nav" aria-label="Primary navigation">
      <a class="brand" href="/">machinageist</a>
      <div class="nav-right">
        <div class="nav-links">
          <a href="/start-here" class="nav-link{% if self.section() == "start"     %} is-active{% endif %}">Start Here</a>
          <a href="/about"     class="nav-link{% if self.section() == "about"     %} is-active{% endif %}">About</a>
          <a href="/portfolio" class="nav-link{% if self.section() == "portfolio" %} is-active{% endif %}">Portfolio</a>
          <a href="/blog"      class="nav-link{% if self.section() == "writing"   %} is-active{% endif %}">Writing</a>
          <a href="/wiki"      class="nav-link{% if self.section() == "wiki"      %} is-active{% endif %}">Archive</a>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle light/dark theme"></button>
      </div>
    </nav>
  </header>

  <main id="content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>machinageist.dev &mdash; Jeff Cincoski</span>
      <nav aria-label="Footer navigation">
        <a href="https://github.com/machinageist/mg-server" rel="noopener noreferrer">Source</a>
        <span>updated on: 2026-07-10</span>
      </nav>
    </div>
  </footer>

  <script src="/static/js/main.js?v=20260525-themed"></script>
</body>
</html>
