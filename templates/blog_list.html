{% extends "base.html" %}

{% block content %}
<section>
  <h1>Writing</h1>
  <p class="section-intro">
    Implementation notes on Rust, systems programming, security tooling,
    and the infrastructure behind the work.
  </p>

  <ul class="post-list">
    {% for post in posts %}
    <li class="post-item">
      <span class="post-date">{{ post.date }}</span>
      <a href="/blog/{{ post.slug }}">{{ post.title }}</a>
      <p class="post-summary">{{ post.summary }}</p>
    </li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
